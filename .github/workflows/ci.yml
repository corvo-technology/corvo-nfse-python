name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Byte-compile
        run: python -m compileall -q src

      - name: Type check
        run: mypy src

      - name: Test
        # Contract tests auto-skip unless CORVO_API_KEY + CORVO_BASE_URL are set.
        run: pytest
        env:
          CORVO_API_KEY: ${{ secrets.CORVO_API_KEY }}
          CORVO_BASE_URL: ${{ secrets.CORVO_BASE_URL }}
