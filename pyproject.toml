[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corvo-nfse"
version = "0.1.0"
description = "The Python SDK for the Corvo NFS-e API — result-style errors, cursor pagination, webhook signature verification."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Corvo Technology" }]
keywords = ["nfse", "brazil", "fiscal", "invoice", "corvo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/corvo-technology/corvo-nfse-python"
Documentation = "https://github.com/corvo-technology/corvo-nfse-python#readme"
Repository = "https://github.com/corvo-technology/corvo-nfse-python"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corvo_nfse = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.10"
